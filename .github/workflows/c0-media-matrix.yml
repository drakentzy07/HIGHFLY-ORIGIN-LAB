name: C0-F media licence matrix (no asset downloads)

on:
  push:
    branches: [c0-audit-claudecraft-v0447]
    paths:
      - "scripts/c0_media_matrix.mjs"
      - "scripts/c0_runtime_media_matrix.mjs"
      - "scripts/c0_inventory.mjs"
      - "tests/c0_media_matrix.test.mjs"
      - "tests/c0_runtime_media_matrix.test.mjs"
      - ".github/workflows/c0-media-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout HIGHFLY licence scanner only
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run fail-closed license logic tests
        run: node --test tests/c0_media_matrix.test.mjs tests/c0_runtime_media_matrix.test.mjs
      - name: Inspect original Git tree and pinned credits (metadata only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/c0_media_matrix.mjs
      - name: Cross-check actual renderer media manifest
        run: node scripts/c0_runtime_media_matrix.mjs
      - name: Upload path matrix only, never original assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-c0-media-licence-matrix
          path: reports/c0/media/
          if-no-files-found: warn
          retention-days: 14
