name: C0-D unmodified real Sim and wolf smoke

on:
  push:
    branches: [c0-audit-claudecraft-v0447]
    paths:
      - "scripts/c0_sim_smoke.ts"
      - ".github/workflows/c0-sim-smoke.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout HIGHFLY smoke script only
        uses: actions/checkout@v4
        with:
          path: highfly
          persist-credentials: false
      - name: Sparse original source checkout (no user media)
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: upstream
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            src
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute original simulation, entity spawn and ticks
        run: npx --yes --package=tsx@4.22.4 tsx highfly/scripts/c0_sim_smoke.ts
      - name: Upload metrics only, never original files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-c0-sim-smoke
          path: highfly/reports/c0/sim/
          if-no-files-found: warn
          retention-days: 14
