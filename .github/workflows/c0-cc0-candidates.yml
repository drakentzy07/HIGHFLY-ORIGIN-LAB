name: C0-I CC0 building and wolf candidate provenance (metadata only)

on:
  push:
    branches: [c0-audit-claudecraft-v0447]
    paths:
      - "scripts/c0_cc0_candidate_audit.mjs"
      - ".github/workflows/c0-cc0-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout HIGHFLY audit tools
        uses: actions/checkout@v4
        with:
          path: highfly
          persist-credentials: false
      - name: Checkout pinned KayKit official original sources ONLY
        uses: actions/checkout@v4
        with:
          repository: KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0
          ref: 84fa4e91af6a88989be7c99e0891cede11f2ca38
          path: kaykit
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            LICENSE.txt
            addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout pinned ClaudeCraft wolf and credit register ONLY
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: upstream
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            CREDITS.md
            public/models/creatures
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify licenses and calculate exact original asset hashes
        run: node highfly/scripts/c0_cc0_candidate_audit.mjs
      - name: Upload provenance/hash report ONLY, never candidate binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-c0-i-cc0-provenance
          path: highfly/reports/c0/assets/
          retention-days: 14
          if-no-files-found: warn
