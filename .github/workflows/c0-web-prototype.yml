name: C0-G WebGL original world prototype build + release gate

on:
  push:
    branches: [c0-audit-claudecraft-v0447]
    paths:
      - "web/**"
      - "scripts/c0_build_web.mjs"
      - "scripts/c0_stage_cc0_media.mjs"
      - "scripts/c0_release_gate.mjs"
      - "config/c0_approved_assets.json"
      - ".github/workflows/c0-web-prototype.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout HIGHFLY C0-G
        uses: actions/checkout@v4
        with:
          path: highfly
          persist-credentials: false
      - name: Checkout ONLY original official source and MIT licence
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: upstream
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src
            CREDITS.md
            public/models/creatures
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Checkout pinned official KayKit CC0 buildings
        uses: actions/checkout@v4
        with:
          repository: KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0
          ref: 84fa4e91af6a88989be7c99e0891cede11f2ca38
          path: kaykit
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            LICENSE.txt
            addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser bundle tooling in HIGHFLY only
        run: npm install --prefix highfly --no-save --no-package-lock --ignore-scripts esbuild@0.28.1 three@0.185.0
      - name: Bundle real original world plus custom procedural renderer
        run: node highfly/scripts/c0_build_web.mjs
      - name: Stage six verified CC0 model files (2 buildings + wolf)
        run: node highfly/scripts/c0_stage_cc0_media.mjs
      - name: Fail closed on unapproved media and missing credits
        run: node highfly/scripts/c0_release_gate.mjs highfly/dist highfly/config/c0_approved_assets.json
      - name: Upload clean proof-of-concept build (not deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-c0-g-3d-world-prototype
          path: highfly/dist/
          retention-days: 14
          if-no-files-found: error
      - name: Upload build diagnostics, even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-c0-g-diagnostics
          path: highfly/reports/c0/web/
          retention-days: 14
          if-no-files-found: warn
