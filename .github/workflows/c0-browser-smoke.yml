name: C0-G headless mobile browser smoke

on:
  push:
    branches: [c0-audit-claudecraft-v0447]
    paths:
      - "web/**"
      - "scripts/c0_browser_smoke.mjs"
      - "scripts/c0_build_web.mjs"
      - ".github/workflows/c0-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Checkout HIGHFLY test and renderer
        uses: actions/checkout@v4
        with:
          path: highfly
          persist-credentials: false
      - name: Checkout exact original code only
        uses: actions/checkout@v4
        with:
          repository: levy-street/world-of-claudecraft
          ref: 493c35a108cef6c8aa290e8793107b1cd117886e
          path: upstream
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            src
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install esbuild, Three.js and Chrome automation driver
        run: npm install --prefix highfly --no-save --no-package-lock --ignore-scripts esbuild@0.28.1 three@0.185.0 playwright-core@1.61.1
      - name: Build original-code browser simulation
        run: node highfly/scripts/c0_build_web.mjs
      - name: Licence and asset gate
        run: node highfly/scripts/c0_release_gate.mjs highfly/dist highfly/config/c0_approved_assets.json
      - name: Start local static web host
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory highfly/dist > /tmp/highfly-http.log 2>&1 &
          sleep 2
      - name: Assert C0-G starts and works on 915x412 touch viewport
        run: node highfly/scripts/c0_browser_smoke.mjs
      - name: Upload browser diagnostics and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highfly-c0-g-mobile-browser-smoke
          path: highfly/reports/c0/browser/
          retention-days: 14
          if-no-files-found: warn
